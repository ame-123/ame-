cases:
  - case_id: itinerary-progress-tool-path
    user_message: 请帮我查一下 SO20260602103000009-a1000009 的行程进度
    runtime_context:
      currentUserOrders:
        - orderNo: SO20260602103000009-a1000009
          userId: U1001
          fulfillmentStatus: SHIPPED
          logisticsStatus: IN_TRANSIT
          items:
            - productName: 东京五日机票酒店
    expected_signals:
      - 行程进度
      - 出行中
    expected_tools:
      - get_order_detail
      - get_order_logistics
    forbidden_tools:
      - retrieve_knowledge
    expected_trace_events:
      - runtime_context_built
      - context_built
      - tool_finished
      - cost_recorded
    expected_session_state:
      - trace.public_trace_only=true

  - case_id: unshipped-refund-hitl
    user_message: SO20260601090000008-a1000008 还没出行，我现在能退票吗？
    runtime_context:
      currentUserOrders:
        - orderNo: SO20260601090000008-a1000008
          userId: U1001
          paymentStatus: PAID
          fulfillmentStatus: PAID_PENDING_SHIPMENT
          items:
            - productName: 东京五日机票酒店
    expected_signals:
      - 人工审批
      - require_approval
    expected_tools:
      - get_order_detail
    expected_citations:
      - refund_before_shipping
    expected_trace_events:
      - rag_pre_retrieved
      - workflow_completed
      - human_approval_required
      - cost_recorded
    expected_session_state:
      - workflow.pending_action=require_approval
      - workflow.workflow_type=pre_departure_refund
      - needs_human_approval=true
    forbidden_text:
      - 已退票成功
      - 已到账

