  - case_id: degradation-transfer-boundary
    user_message: 【故障注入演示】模拟行程服务返回 SERVICE_TIMEOUT：请帮我查一下 SO20260602103000009-a1000009 的行程进度
    expected_signals:
      - 暂时不可用
      - 转人工
    expected_trace_events:
      - degradation_triggered
      - cost_recorded
    expected_session_state:
      - degraded=true
      - cost_summary.degradation.degraded=true

  - case_id: refund-resume-approved-idempotent
    case_type: resume
    start_user_message: SO20260601090000008-a1000008 还没出行，我现在能退票吗？
    runtime_context:
      currentUserOrders:
        - orderNo: SO20260601090000008-a1000008
          userId: U1001
          paymentStatus: PAID
          fulfillmentStatus: PAID_PENDING_SHIPMENT
          items:
            - productName: 东京五日机票酒店
    decision: approved
    repeat_resume: true
    expected_signals:
      - 审批通过
      - 不执行真实退票
    expected_citations:
      - refund_before_shipping
    expected_trace_events:
      - workflow_completed
      - human_approval_required
      - workflow_resumed
      - human_approval_resolved
      - cost_recorded
    expected_session_state:
      - resume_status=completed
      - workflow.pending_action=approval_accepted
      - resume_result.accepted=true
      - resume_result.idempotent_replay=true
      - business_recheck.passed=true
      - cost_summary.path_type=hitl_resume_path
      - trace.public_trace_only=true
    forbidden_text:
      - 已到账

  - case_id: refund-resume-invalid-token-blocked
    case_type: resume
    start_user_message: SO20260601090000008-a1000008 还没出行，我现在能退票吗？
    runtime_context:
      currentUserOrders:
        - orderNo: SO20260601090000008-a1000008
          userId: U1001
          paymentStatus: PAID
          fulfillmentStatus: PAID_PENDING_SHIPMENT
          items:
            - productName: 东京五日机票酒店
    decision: approved
    resume_token_override: invalid
    expected_signals:
      - 审批恢复没有通过校验
      - invalid_resume_token
    expected_trace_events:
      - workflow_completed
      - human_approval_required
    expected_session_state:
      - resume_status=blocked
      - resume_result.accepted=false
      - resume_result.reason=invalid_resume_token
      - business_recheck.passed=false
      - trace.public_trace_only=true
    forbidden_text:
      - 审批通过
      - 已到账

