      - 满 6000 减 400
      - 以套餐页和结算页为准
    expected_tools:
      - search_products
    expected_citations:
      - promotion_618_stack_rule
    expected_trace_events:
      - rag_pre_retrieved
      - context_source_safety_checked
      - mcp_binding_resolved
      - cost_recorded
    expected_session_state:
      - intent=product_query
      - memory.last_product_name=东京五日机票酒店
      - mcp.selected_tool=search_products

  - case_id: after-trip-change-transfer
    user_message: SO20260712090000010-a1000010 已出行，我想七天无理由退货
    runtime_context:
      currentUserOrders:
        - orderNo: SO20260712090000010-a1000010
          userId: U1001
          fulfillmentStatus: DELIVERED
          logisticsStatus: SIGNED
          deliveredAt: 2026-07-12T09:00:00
          returnable: true
          items:
            - productName: 东京五日机票酒店
              returnable: true
    expected_signals:
      - 不走未出行退票
      - 转人工
    expected_tools:
