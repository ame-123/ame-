### 云端 RTX 4090 路由 DPO（不要在本机 4070 上跑这份）
### 实例里先放好 outputs/sft-qwen25-3b-ctx-lora，再：
###   export USE_MODELSCOPE_HUB=1
###   llamafactory-cli train train/dpo_qwen25_3b_4090.yaml

model_name_or_path: Qwen/Qwen2.5-3B-Instruct
adapter_name_or_path: outputs/sft-qwen25-3b-ctx-lora
trust_remote_code: true
stage: dpo
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
pref_beta: 0.1

dataset_dir: data
dataset: router_dpo
template: qwen
cutoff_len: 2048
max_samples: 2000
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 2

output_dir: outputs/dpo-qwen25-3b-ctx-lora
logging_steps: 5
save_steps: 50
save_total_limit: 2
plot_loss: true
overwrite_output_dir: true
report_to: none

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 5.0e-6
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_steps: 5
bf16: true
flash_attn: fa2
optim: adamw_torch

do_eval: true
val_size: 0.0
eval_dataset: router_dpo_val
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 50

ddp_timeout: 180000000
