# 针对课程「未优化问法」的召回 gold（200 条）。
# 对照第 13 课口语归一、第 15 课售后长尾/场景限制、第 41 课 Hybrid 关键词。
# 电商原场景 → 出行映射：耳麦/耳机→套餐；春季音频节/旧618→早鸟 vs 往年618；
# 300减40→满6000减400；未发货→未出行；开票→电子发票；少一根/盒子/压了→还没走/无理由等口语。
# 正规完整问句尽量不收，那些纯向量已经会。
k_default: 4
cases:
  # --- 1. 口语别名：叠券/能叠吗/会员券/促销/退钱 ---
  - case_id: colloq-01
    gap: colloquial
    query: 能叠吗
    expected_sources: [promotion_policy.md, member_coupon_policy.md]
    must_contain: ["叠加"]
    hard_for: [vector_only]
